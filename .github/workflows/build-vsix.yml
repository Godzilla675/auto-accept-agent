name: Build VSIX on PR Merge

on:
  pull_request:
    types: [closed]
    branches: [main, master]

jobs:
  build-vsix:
    # Only run if PR was merged (not just closed)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package VSIX
        run: vsce package --out auto-accept-agent.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        id: upload-vsix
        with:
          name: auto-accept-agent-vsix
          path: auto-accept-agent.vsix
          retention-days: 90

      - name: Comment on PR with download link
        uses: actions/github-script@v7
        with:
          script: |
            const artifactUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const version = require('./package.json').version;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## 📦 VSIX Build Complete!\n\n**Version:** ${version}\n\n**Download the extension:**\n1. Go to the [workflow run](${artifactUrl})\n2. Scroll to "Artifacts" section\n3. Download \`auto-accept-agent-vsix\`\n\nThe artifact will be available for 90 days.`
            });
